[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kindify"
version = "0.1.0"
description = "Detect toxic comments and rewrite them politely"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Annavaram" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
transformers = ["torch>=2.1", "transformers>=4.40"]
embeddings = ["sentence-transformers>=3.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
all = ["kindify[transformers,embeddings,api]"]
dev = ["pytest>=8"]

[project.scripts]
kindify = "kindify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
